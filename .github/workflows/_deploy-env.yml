name: Deploy one environment
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # prod has a required reviewer = approval gate
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform workspace select -or-create=true ${{ inputs.environment }}
      - run: terraform apply -input=false -auto-approve -var-file=env/${{ inputs.environment }}.tfvars
      - name: Smoke test
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
          SMOKE_CLIENT_ID: ${{ vars.SMOKE_CLIENT_ID }}
          SMOKE_CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
        run: bash ../scripts/smoke.sh "$(terraform output -raw api_url)"