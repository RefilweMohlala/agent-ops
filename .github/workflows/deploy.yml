name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  dev:
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
    secrets: inherit
  prod:
    needs: dev
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
    secrets: inherit